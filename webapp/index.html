<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gimnasio - Registro</title>
</head>
<body>

    <h2>Control de Asistencia - Gimnasio</h2>
    
    <form id="formRegistro">
        <label>Nombre Completo:</label><br>
        <input type="text" id="nombre" required><br><br>

        <label>Identificación / Cédula:</label><br>
        <input type="text" id="cedula" required><br><br>

        <button type="submit">Registrar Miembro</button>
    </form>

    <h3 id="respuesta" style="color: green;"></h3>

    <script>
        document.getElementById('formRegistro').addEventListener('submit', function(e) {
            e.preventDefault(); // Detiene el parpadeo/recarga de la página

            const nombreInput = document.getElementById('nombre').value;
            const cedulaInput = document.getElementById('cedula').value;

            // Enviamos los parámetros al Servlet mediante POST
            fetch(`./registrarUsuario?nombre=${encodeURIComponent(nombreInput)}&cedula=${encodeURIComponent(cedulaInput)}`, {
                method: 'POST'
            })
            .then(res => res.text())
            .then(textoDeJava => {
                document.getElementById('respuesta').innerText = textoDeJava;
                document.getElementById('formRegistro').reset(); // Limpia el formulario
            })
            .catch(err => {
                document.getElementById('respuesta').innerText = "Error de conexión.";
                console.error(err);
            });
        });
    </script>
</body>
</html>
